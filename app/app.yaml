apiVersion: v1
kind: Namespace
metadata:
  name: retail-demo
  labels:
    demo.suse.com/owner: retail-team
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-content
  namespace: retail-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Retail Demo</title>
    </head>
    <body>
      <h1>Retail demo is running</h1>
      <p>Delivered and governed through Rancher Prime + Fleet.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: retail-demo
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: storefront-content
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: retail-demo
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
