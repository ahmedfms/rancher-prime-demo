apiVersion: v1
kind: Namespace
metadata:
  name: retail-demo
  labels:
    demo.suse.com/owner: retail-team
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-content
  namespace: retail-demo
data:
  index.html: |
    <!doctype html>
    <html><head><title>Retail Storefront</title></head>
    <body style="font-family:sans-serif;background:#0c322c;color:white;text-align:center;padding:70px">
      <h1>Retail Storefront v1</h1>
      <p>Delivered and governed through Rancher Prime + Fleet</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: retail-demo
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
      - name: web
        image: registry.suse.com/bci/bci-busybox:15.7
        command: ["/bin/sh","-c"]
        args: ["httpd -f -p 8080 -h /www"]
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: content
          mountPath: /www
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: content
        configMap:
          name: storefront-content
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: retail-demo
spec:
  selector:
    app: storefront
  ports:
  - name: http
    port: 80
    targetPort: http
